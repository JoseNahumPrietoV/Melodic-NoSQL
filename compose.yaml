services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melodic-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Melodic
      APP_ENV: local
      APP_KEY: base64:V0pVZk9xS3h4c3R4Qm1Qb3d6R2h5TnNqQW1TQ3V4eGs=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_LOCALE: es
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: melodic
      DB_USERNAME: melodic
      DB_PASSWORD: melodic_dev
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      # Conexión reservada para la futura migración a MongoDB.
      MONGODB_URI: mongodb://root:root@mongodb:27017/melodic?authSource=admin
      MONGODB_DATABASE: melodic
    volumes:
      - app-storage:/var/www/html/storage
      - app-database:/var/lib/melodic
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: melodic-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: melodic
      MYSQL_USER: melodic
      MYSQL_PASSWORD: melodic_dev
      MYSQL_ROOT_PASSWORD: root_dev
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongodb:
    image: mongo:8.0
    container_name: melodic-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: melodic
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-storage:
  app-database:
  mysql-data:
  mongodb-data:
