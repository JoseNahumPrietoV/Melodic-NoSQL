services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melodic-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Melodic
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost:8000
      APP_LOCALE: es
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: melodic
      DB_USERNAME: melodic
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SESSION_DRIVER: database
      SESSION_CONNECTION: mysql
      CACHE_STORE: database
      DB_CACHE_CONNECTION: mysql
      QUEUE_CONNECTION: database
      DB_QUEUE_CONNECTION: mysql
      FILESYSTEM_DISK: local
      MONGODB_URI: mongodb://melodic_app:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongodb:27017/melodic?authSource=admin&replicaSet=rs0&tls=true&tlsCAFile=/run/secrets/mongodb_tls_ca
      MONGODB_DATABASE: melodic
    volumes:
      - app-storage:/var/www/html/storage
      - app-database:/var/lib/melodic
    networks:
      - default
      - backend
    secrets:
      - mongodb_tls_ca
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: melodic-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: melodic
      MYSQL_USER: melodic
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongodb:
    image: mongo:8.0
    container_name: melodic-mongodb
    restart: unless-stopped
    networks:
      - backend
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: melodic
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      MONGO_READONLY_PASSWORD: ${MONGO_READONLY_PASSWORD:?MONGO_READONLY_PASSWORD is required}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?MONGO_BACKUP_PASSWORD is required}
      MONGO_TEST_PASSWORD: ${MONGO_TEST_PASSWORD:-}
    command:
      - bash
      - -c
      - >-
        install -m 400 -o mongodb -g mongodb /run/secrets/mongodb_keyfile /data/configdb/keyfile
        && install -m 400 -o mongodb -g mongodb /run/secrets/mongodb_tls_certificate /data/configdb/server.pem
        && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/keyfile --bind_ip_all
        --tlsMode requireTLS --tlsCertificateKeyFile /data/configdb/server.pem
        --tlsCAFile /run/secrets/mongodb_tls_ca --tlsAllowConnectionsWithoutCertificates
        --tlsDisabledProtocols TLS1_0,TLS1_1
    secrets:
      - mongodb_keyfile
      - mongodb_tls_ca
      - mongodb_tls_certificate
    volumes:
      - mongodb-data:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --tls --tlsCAFile /run/secrets/mongodb_tls_ca
          -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"
          | grep -qx 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

networks:
  backend:
    internal: true

secrets:
  mongodb_keyfile:
    file: ./docker/mongo/keyfile
  mongodb_tls_ca:
    file: ./docker/mongo/tls/ca.pem
  mongodb_tls_certificate:
    file: ./docker/mongo/tls/server.pem

volumes:
  app-storage:
  app-database:
  mysql-data:
  mongodb-data:
